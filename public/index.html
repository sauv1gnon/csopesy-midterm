:root {
  color-scheme: light;

  /* ---- Font families ---------------------------------------------------- */

  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Menlo", "Consolas", monospace;

  /* ---- Type scale (rem; 1rem = 16px) ------------------------------------ */

  --fs-xs: 0.75rem;      /* badges, meta */
  --fs-sm: 0.875rem;     /* secondary text, tables */
  --fs-base: 1rem;       /* body, options */
  --fs-md: 1.125rem;     /* question stem */
  --fs-lg: 1.375rem;     /* section titles */
  --fs-xl: 1.75rem;      /* page titles */
  --fs-2xl: 2.25rem;     /* stat values */
  --fs-hero: 3.5rem;     /* result score */

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;

  --lh-tight: 1.2;
  --lh-snug: 1.35;
  --lh-base: 1.55;
  --lh-read: 1.7;        /* source viewer */
  --lh-none: 1;          /* icon glyphs, hero numbers */

  --tracking-caps: 0.06em;
  --tracking-tight: -0.01em;
  --tracking-display: 0.02em;   /* Bebas Neue is tight; open it slightly */

  /* ---- Spacing scale (4px grid) ---------------------------------------- */
  --sp-0: 0;
  --sp-px: 1px;
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.25rem;
  --sp-6: 1.5rem;
  --sp-7: 2rem;
  --sp-8: 2.5rem;
  --sp-9: 3rem;
  --sp-10: 4rem;

  --gutter: var(--sp-4);          /* page side gutter at phone width */
  --gutter-wide: var(--sp-7);     /* page side gutter on desktop */

  /* ---- Sizes & widths --------------------------------------------------- */
  --w-page: 72rem;       /* home, results, practice picker */
  --w-read: 46rem;       /* one question / reading column */
  --w-sidebar: 18.5rem;  /* exam navigator, file list */
  --w-sidepanel: 15rem;  /* docked practice session panel (left of the centered question) */
  --w-dialog: 34rem;
  --w-drawer-max: 88vw;  /* drawer never covers the whole phone screen */
  --w-flex-sm: 8rem;     /* flex-basis for small items (true/false options, progress) */
  --w-flex-md: 12rem;    /* flex-basis for list rows */
  --w-flex-lg: 18rem;    /* flex-basis for heading text blocks */
  --w-meter-label: 11rem;
  --w-meter-value: 4.5rem;
  --w-meter-band: 10rem;   /* band + trend column, fixed so bars align */
  --h-topbar: 3.5rem;
  --h-control: 2.5rem;   /* buttons, inputs */
  --h-control-sm: 2rem;
  --h-touch: 2.75rem;    /* minimum touch target */
  --h-bar: 0.5rem;       /* progress / meter bar thickness */
  --h-bar-lg: 0.75rem;
  --size-chip: 2.25rem;  /* question navigator chip */
  --size-icon: 1.125rem;
  --size-icon-sm: 0.875rem;
  --size-icon-lg: 1.5rem;
  --size-key: 1.75rem;   /* option letter bubble */

  /* ---- Borders, radii, shadows ----------------------------------------- */
  --bw-1: 1px;
  --bw-2: 2px;
  --bw-3: 3px;

  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  --shadow-1: 0 1px 2px rgb(20 24 31 / 0.06), 0 1px 1px rgb(20 24 31 / 0.04);
  --shadow-2: 0 4px 12px rgb(20 24 31 / 0.08), 0 1px 3px rgb(20 24 31 / 0.06);
  --shadow-3: 0 16px 40px rgb(20 24 31 / 0.18), 0 2px 8px rgb(20 24 31 / 0.08);
  --focus-ring: 0 0 0 3px var(--c-focus);

  /* ---- Motion & layers -------------------------------------------------- */
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --z-sticky: 20;
  --z-drawer: 40;
  --z-toast: 60;

  --opacity-disabled: 0.5;
  --opacity-muted: 0.72;

  /* ---- Color: neutrals -------------------------------------------------- */
  --c-bg: #f6f6f3;            /* page */
  --c-surface: #ffffff;       /* cards, questions */
  --c-surface-2: #f0f0eb;     /* inset areas, table header, sidebar */
  --c-surface-3: #e7e6e0;     /* hover on inset, track of bars */
  --c-border: #e1e0d9;
  --c-border-strong: #c9c7be;
  --c-ink: #1b1d21;           /* primary text */
  --c-ink-2: #474a51;         /* secondary text */
  --c-ink-3: #686b72;         /* muted text, meta (≥4.5:1 on surface) */
  --c-ink-inverse: #ffffff;
  --c-scrim: rgb(15 17 21 / 0.45);

  /* ---- Color: accent (actions, current, links) ------------------------- */
  --c-accent: #2f56d3;
  --c-accent-strong: #2143ad;
  --c-accent-soft: #e8edfc;
  --c-accent-ink: #1e3c9c;    /* accent text on soft background */
  --c-focus: rgb(47 86 211 / 0.35);

  /* ---- Color: semantic exam states ------------------------------------- */
  --c-correct: #1c7a39;
  --c-correct-soft: #e5f3e9;
  --c-correct-border: #9fd1ad;
  --c-incorrect: #b42318;
  --c-incorrect-soft: #fcebe9;
  --c-incorrect-border: #efb1aa;
  --c-flag: #9a5b00;          /* flagged, warnings */
  --c-flag-soft: #fdf2da;
  --c-flag-border: #ecc774;
  --c-info: var(--c-accent-ink);
  --c-info-soft: var(--c-accent-soft);
  --c-info-border: #b8c6f3;
  --c-new: #6b3fc4;           /* "New" badge */
  --c-new-soft: #f0eafc;
  --c-highlight: #fff0a6;     /* <mark> excerpt in source viewer */
  --c-highlight-ink: #1b1d21;

  /* ---- Color: mastery bands (validated set) ---------------------------- */
  --c-band-mastered: #1f8f3f;
  --c-band-solid: #2b7bb9;
  --c-band-review: #d9910d;
  --c-band-weak: #d03b3b;
  --c-band-none: #9a9ca1;
  --c-band-mastered-soft: #e4f3e8;
  --c-band-solid-soft: #e3eff8;
  --c-band-review-soft: #fcf1dc;
  --c-band-weak-soft: #fbe7e7;
  --c-band-none-soft: #eeeeec;
  --c-band-mastered-ink: #17692f;
  --c-band-solid-ink: #1f5d8c;
  --c-band-review-ink: #8a5a00;
  --c-band-weak-ink: #a82c2c;
  --c-band-none-ink: #5d6066;

  /* ---- File-type icon tints -------------------------------------------- */
  --c-file-pdf: #c2412d;
  --c-file-slides: #c7641a;
  --c-file-doc: #2b62c4;
  --c-file-text: #5d6066;
}

/* Dark theme — only when the viewer picks it with the toggle; light is the default. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --c-bg: #111214;
  --c-surface: #1a1b1e;
  --c-surface-2: #212226;
  --c-surface-3: #2b2d32;
  --c-border: #2d2f34;
  --c-border-strong: #43464d;
  --c-ink: #ececea;
  --c-ink-2: #bfc1c5;
  --c-ink-3: #9a9da3;
  --c-ink-inverse: #111214;
  --c-scrim: rgb(0 0 0 / 0.6);

  --c-accent: #7d9bff;
  --c-accent-strong: #a3b8ff;
  --c-accent-soft: #1f2849;
  --c-accent-ink: #b8c8ff;
  --c-focus: rgb(125 155 255 / 0.45);

  --c-correct: #5cc27a;
  --c-correct-soft: #16281c;
  --c-correct-border: #2f5d3b;
  --c-incorrect: #ff8a7e;
  --c-incorrect-soft: #331a18;
  --c-incorrect-border: #6e3029;
  --c-flag: #f0b43c;
  --c-flag-soft: #2e2512;
  --c-flag-border: #6a5220;
  --c-info-border: #34437a;
  --c-new: #b99bff;
  --c-new-soft: #271d40;
  --c-highlight: #5a4c10;
  --c-highlight-ink: #fff6d0;

  --c-band-mastered: #35a055;
  --c-band-solid: #4a8fd0;
  --c-band-review: #ad850a;
  --c-band-weak: #e85d80;
  --c-band-none: #6c6f76;
  --c-band-mastered-soft: #17291d;
  --c-band-solid-soft: #16243a;
  --c-band-review-soft: #2b2310;
  --c-band-weak-soft: #331a22;
  --c-band-none-soft: #25262a;
  --c-band-mastered-ink: #7fd499;
  --c-band-solid-ink: #8fbdf0;
  --c-band-review-ink: #e8c35c;
  --c-band-weak-ink: #ff9bb3;
  --c-band-none-ink: #b3b5ba;

  --c-file-pdf: #ff8c78;
  --c-file-slides: #f5a15e;
  --c-file-doc: #86a9ff;
  --c-file-text: #b3b5ba;

  --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-2: 0 4px 14px rgb(0 0 0 / 0.45);
  --shadow-3: 0 18px 44px rgb(0 0 0 / 0.6);
}

/* ==========================================================================
   Mock Exam Builder — components
   Built only from tokens.css. No raw hex values, px font sizes or one-off
   numbers. The only literal values are the two layout breakpoints (media
   queries cannot read custom properties): 48rem (tablet) and 64rem (desktop).

   The single permitted inline style in any output is the data variable
   `--pct` on .progress / .meter__fill (a 0–100 number). It carries data,
   not styling.

   Sections
     1  Base & reset          9  Question & options      17 Source browser
     2  Layout & utilities   10  Feedback & citation     18 Dialog
     3  Top bar & footer     11  Question navigator      19 Toast
     4  Buttons              12  Segmented & filters     20 Empty state
     5  Cards                13  Reorder list            21 Forms
     6  Badges & bands       14  Mastery & history       22 Icons & kbd
     7  Stat tiles           15  Data table              23 Print
     8  Progress & meters    16  Callouts & study plan

   Direction
   Calm, focused and academic. Quiet paper-white page, one ink-blue accent
   for actions and "current", reserved semantic colors for correct /
   incorrect / flagged, and a validated five-step mastery palette (Mastered
   ★ · Solid ✓ · Needs review ! · Weak ✕ · Not attempted –) that always
   shows glyph + label. Bebas Neue for display headings (h1, h2, top-bar
   title, score) and Inter for all other text, both embedded from
   `design-system/fonts/` by `build.py` so the file still works offline (~80 KB); a
   Arial as the reading face in the source viewer and excerpts, 4px spacing grid, light theme by
   default, dark only via the toggle.

   Rules (settled; don't reintroduce)
   - One signal per state. Bands and answer status are coloured glyph +
     text, not pills; no row tints, no coloured left stripes. The only
     capsule is the New badge.
   - Citations are inline link-style buttons, not pills. Filters are ghost
     text buttons divided by `|`; the active one gets full ink on
     `surface-2`.
   - No eyebrow that repeats its heading; eyebrows are sentence case and
     only carry a fact the heading lacks (e.g. "Section 1 of 3").
   - No decorative icons: no sparkle, no icon tiles on entry cards. Accent
     blue is for primary actions, progress, links and "current" only; info
     notes such as "New in version N" are neutral.
   - Empty states name the cause and the way out (e.g. "No flagged
     questions in this attempt" + Show all).
   ========================================================================== */

/* 1 ─ Base & reset ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--c-bg);
  color: var(--c-ink);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: var(--lh-base);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; line-height: var(--lh-tight); letter-spacing: var(--tracking-tight); }
h1, h2 { font-family: var(--font-display); font-weight: var(--fw-regular); letter-spacing: var(--tracking-display); line-height: var(--lh-none); }
h1 { font-size: var(--fs-2xl); }  /* Bebas caps read a step smaller than Inter; display sizes go up one step */
h2 { font-size: var(--fs-xl); }
h3 { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
h4 { font-size: var(--fs-base); font-weight: var(--fw-semibold); }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--c-accent); text-underline-offset: 0.18em; }
a:hover { color: var(--c-accent-strong); }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
[hidden] { display: none !important; }

.skip-link {
  position: absolute; left: var(--sp-2); top: calc(-1 * var(--h-topbar));
  padding: var(--sp-2) var(--sp-3); background: var(--c-accent); color: var(--c-ink-inverse);
  border-radius: var(--radius-sm); z-index: var(--z-toast);
}
.skip-link:focus { top: var(--sp-2); }

/* 2 ─ Layout & utilities ───────────────────────────────────────────────── */
.main { padding-block: var(--sp-6) var(--sp-10); }

.page {
  width: 100%;
  max-width: calc(var(--w-page) + 2 * var(--gutter-wide));
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.page--read { max-width: calc(var(--w-read) + 2 * var(--gutter-wide)); }
.page--full { max-width: none; }  /* focus layout: centre on the viewport, not the capped page */

.stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.stack--xs { gap: var(--sp-1); }
.stack--sm { gap: var(--sp-2); }
.stack--lg { gap: var(--sp-6); }
.stack--xl { gap: var(--sp-8); }

.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.cluster--lg { gap: var(--sp-4); }
.cluster--between { justify-content: space-between; }
.cluster--end { justify-content: flex-end; }
.cluster--nowrap { flex-wrap: nowrap; }

.grid { display: grid; gap: var(--sp-4); grid-template-columns: 1fr; }
.grid--2, .grid--3, .grid--4 { grid-template-columns: 1fr; }

.push { margin-inline-start: auto; }
.grow { flex: 1 1 auto; min-width: 0; }

/* Two-column shells: exam / practice (navigator + question), sources (files + viewer) */
.split { display: grid; grid-template-columns: 1fr; gap: var(--sp-6); align-items: start; }
.split__main { min-width: 0; }

/* Focus layout (practice): one centered reading column; a narrow side panel docks to its LEFT
   at ≥64rem and becomes the off-canvas drawer below that. Use the same .focus grid in the status
   bar so the bar lines up exactly with the question card. */
.focus { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); align-items: start; }
.focus__main { grid-column: 1; min-width: 0; width: 100%; max-width: var(--w-read); margin-inline: auto; }

.section { display: flex; flex-direction: column; gap: var(--sp-4); }
.section-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--sp-2) var(--sp-4); }
.section-head__text { flex: 1 1 var(--w-flex-lg); min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.section-head__desc { color: var(--c-ink-2); font-size: var(--fs-sm); }
.section-head__title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2) var(--sp-4); }

.eyebrow {
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-ink-3);
}
.lead { font-size: var(--fs-md); color: var(--c-ink-2); }
.muted { color: var(--c-ink-3); }
.small { font-size: var(--fs-sm); }
.xsmall { font-size: var(--fs-xs); }
.strong { font-weight: var(--fw-semibold); }
.num { font-variant-numeric: tabular-nums; }
.text-correct { color: var(--c-correct); }
.text-incorrect { color: var(--c-incorrect); }
.text-flag { color: var(--c-flag); }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.divider { border: 0; border-top: var(--bw-1) solid var(--c-border); margin: 0; }

.visually-hidden {
  position: absolute !important; width: var(--sp-px); height: var(--sp-px); padding: 0; margin: calc(-1 * var(--sp-px));
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (min-width: 48rem) {
  .page { padding-inline: var(--gutter-wide); }
  .grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid--3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 64rem) {
  .grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .split { grid-template-columns: var(--w-sidebar) minmax(0, 1fr); }
  .split--wide-side { grid-template-columns: calc(var(--w-sidebar) + var(--sp-8)) minmax(0, 1fr); }
}

/* 3 ─ Top bar & footer ─────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--c-surface); border-bottom: var(--bw-1) solid var(--c-border);
}
.topbar__inner {
  max-width: calc(var(--w-page) + 2 * var(--gutter-wide)); margin-inline: auto;
  min-height: var(--h-topbar); padding-inline: var(--gutter);
  display: flex; align-items: center; gap: var(--sp-3);
}
.topbar__brand {
  display: flex; align-items: center; gap: var(--sp-2); min-width: 0;
  color: var(--c-ink); text-decoration: none; font-weight: var(--fw-semibold);
}
.topbar__brand:hover { color: var(--c-ink); }
.topbar__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-size: var(--fs-xl); font-weight: var(--fw-regular); letter-spacing: var(--tracking-display); line-height: var(--lh-none); padding-top: var(--sp-px); }
.topbar__actions { margin-inline-start: auto; display: flex; align-items: center; gap: var(--sp-1); flex: none; }

@media (min-width: 48rem) {
  .topbar__inner { padding-inline: var(--gutter-wide); }
  .topbar__title { font-size: var(--fs-2xl); }
}

/* Sticky exam/practice status bar under the top bar */
.statusbar {
  position: sticky; top: var(--h-topbar); z-index: var(--z-sticky);
  background: var(--c-bg); padding-block: var(--sp-3);
  border-bottom: var(--bw-1) solid var(--c-border);
  margin-block: calc(-1 * var(--sp-6)) var(--sp-6);
}
.statusbar__inner { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); }
.statusbar__progress { flex: 1 1 var(--w-flex-md); min-width: var(--w-flex-sm); display: flex; flex-direction: column; gap: var(--sp-1); }

.footer {
  padding: var(--sp-6) var(--gutter); border-top: var(--bw-1) solid var(--c-border);
  color: var(--c-ink-3); font-size: var(--fs-xs); text-align: center;
}

/* 4 ─ Buttons ──────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: var(--h-control); padding: var(--sp-2) var(--sp-4);
  border: var(--bw-1) solid var(--c-border-strong); border-radius: var(--radius-md);
  background: var(--c-surface); color: var(--c-ink);
  font-size: var(--fs-sm); font-weight: var(--fw-semibold); line-height: var(--lh-tight);
  text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.btn:hover { background: var(--c-surface-2); color: var(--c-ink); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: var(--opacity-disabled); cursor: not-allowed; }

.btn--primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-ink-inverse); }
.btn--primary:hover { background: var(--c-accent-strong); border-color: var(--c-accent-strong); color: var(--c-ink-inverse); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--c-ink-2); }
.btn--ghost:hover { background: var(--c-surface-2); color: var(--c-ink); }
.btn--danger { color: var(--c-incorrect); border-color: var(--c-incorrect-border); }
.btn--danger:hover { background: var(--c-incorrect-soft); color: var(--c-incorrect); }
.btn--link { background: none; border: 0; padding: 0; min-height: 0; color: var(--c-accent); font-weight: var(--fw-medium); }
.btn--link:hover { background: none; color: var(--c-accent-strong); text-decoration: underline; }

.btn--sm { min-height: var(--h-control-sm); padding: var(--sp-1) var(--sp-3); font-size: var(--fs-xs); border-radius: var(--radius-sm); }
.btn--lg { min-height: var(--h-touch); padding: var(--sp-3) var(--sp-5); font-size: var(--fs-base); }
.btn--block { width: 100%; }
.btn--icon { padding: 0; width: var(--h-control); min-width: var(--h-control); }
.btn--icon.btn--sm { width: var(--h-control-sm); min-width: var(--h-control-sm); }
.btn[aria-pressed="true"] { background: var(--c-flag-soft); border-color: var(--c-flag-border); color: var(--c-flag); }

/* 5 ─ Cards ────────────────────────────────────────────────────────────── */
.card {
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding: var(--sp-5); background: var(--c-surface);
  border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1); min-width: 0;
}
.card--flush { padding: 0; gap: 0; overflow: hidden; }
.card--inset { background: var(--c-surface-2); box-shadow: none; }
.card--interactive { cursor: pointer; transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); text-align: start; }
.card--interactive:hover { border-color: var(--c-border-strong); box-shadow: var(--shadow-2); }
.card--accent, .card--accent.card--interactive:hover { border-color: var(--c-accent); }

.card__head { display: flex; align-items: flex-start; gap: var(--sp-3); }
.card__title { font-size: var(--fs-md); font-weight: var(--fw-semibold); line-height: var(--lh-snug); }
.card__desc { color: var(--c-ink-2); font-size: var(--fs-sm); }
.card__foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: auto; padding-top: var(--sp-2); }
.card__section { padding: var(--sp-4) var(--sp-5); }
.card__section + .card__section { border-top: var(--bw-1) solid var(--c-border); }

/* Entry cards on the home screen */
.entry { gap: var(--sp-2); }

/* 6 ─ Badges & mastery bands ───────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: var(--sp-1); color: var(--c-ink-2);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); line-height: var(--lh-base); white-space: nowrap;
}
/* The only capsule: "New" has to be spotted in a list at a glance */
.badge--new { padding: var(--sp-px) var(--sp-2); border-radius: var(--radius-pill); background: var(--c-new-soft); color: var(--c-new); }
.badge--focus { color: var(--c-accent-ink); }
.badge--correct { color: var(--c-correct); }
.badge--incorrect { color: var(--c-incorrect); }
.badge--flag { color: var(--c-flag); }
.badge--outline { color: var(--c-ink-3); }

.band {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); line-height: var(--lh-base); white-space: nowrap;
  color: var(--c-band-none-ink);
}
.band__dot { font-size: var(--fs-2xs); font-weight: var(--fw-bold); line-height: var(--lh-none); }
.band[data-band="mastered"] { color: var(--c-band-mastered-ink); }
.band[data-band="solid"] { color: var(--c-band-solid-ink); }
.band[data-band="review"] { color: var(--c-band-review-ink); }
.band[data-band="weak"] { color: var(--c-band-weak-ink); }

.stack > .band, .stack > .badge { align-self: flex-start; }

.trend { display: inline-flex; align-items: center; gap: var(--sp-px); font-size: var(--fs-xs); font-weight: var(--fw-semibold); white-space: nowrap; }
.trend--up { color: var(--c-correct); }
.trend--down { color: var(--c-incorrect); }
.trend--flat { color: var(--c-ink-3); }

.tag { font-size: var(--fs-xs); color: var(--c-ink-3); white-space: nowrap; }
.tag + .tag::before { content: "·"; margin-inline-end: var(--sp-2); }

/* 7 ─ Stat tiles ───────────────────────────────────────────────────────── */
.stat-grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 64rem) { .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.stat {
  display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0;
  padding: var(--sp-4); background: var(--c-surface);
  border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-lg);
}
.stat__label { font-size: var(--fs-xs); color: var(--c-ink-3); font-weight: var(--fw-medium); }
.stat__value { font-size: var(--fs-2xl); font-weight: var(--fw-bold); line-height: var(--lh-tight); font-variant-numeric: tabular-nums; letter-spacing: var(--tracking-tight); }
.stat__unit { font-size: var(--fs-md); font-weight: var(--fw-semibold); color: var(--c-ink-3); margin-inline-start: var(--sp-px); }
.stat__foot { font-size: var(--fs-xs); color: var(--c-ink-3); }

/* Results hero */
.score-hero {
  display: grid; gap: var(--sp-5); grid-template-columns: 1fr; align-items: center;
  padding: var(--sp-6); background: var(--c-surface); border: var(--bw-1) solid var(--c-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-1);
}
.score-hero__value { font-family: var(--font-display); font-size: var(--fs-hero); font-weight: var(--fw-regular); line-height: var(--lh-none); letter-spacing: var(--tracking-display); }
.score-hero > .stack:first-child { justify-self: start; align-items: center; }  /* band centred under the score */
.score-hero .band { align-self: center; }
.score-hero__caption { color: var(--c-ink-2); font-size: var(--fs-sm); }
@media (min-width: 48rem) { .score-hero { grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-8); } }

/* 8 ─ Progress & meters ────────────────────────────────────────────────── */
.progress {
  --pct: 0;
  position: relative; height: var(--h-bar); border-radius: var(--radius-pill);
  background: var(--c-surface-3); overflow: hidden;
}
.progress::after {
  content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--pct) * 1%);
  background: var(--c-accent); border-radius: var(--radius-pill); transition: width var(--dur-base) var(--ease);
}
.progress__label { display: flex; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--c-ink-3); }

/* Section breakdown / level breakdown: label | bar | value | band */
.meter-list { list-style: none; display: flex; flex-direction: column; gap: var(--sp-3); }
.meter {
  display: grid; gap: var(--sp-1) var(--sp-3); align-items: center;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "label value" "bar bar" "band band";
}
.meter__label { grid-area: label; font-size: var(--fs-sm); font-weight: var(--fw-medium); min-width: 0; }
.meter__track { grid-area: bar; position: relative; height: var(--h-bar-lg); border-radius: var(--radius-xs); background: var(--c-surface-3); overflow: hidden; }
.meter__fill {
  --pct: 0;
  position: absolute; inset: 0 auto 0 0; width: calc(var(--pct) * 1%);
  border-radius: var(--radius-xs); background: var(--c-band-none);
}
.meter__value { grid-area: value; font-size: var(--fs-sm); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; text-align: end; }
.meter__band { grid-area: band; }
.meter[data-band="mastered"] .meter__fill { background: var(--c-band-mastered); }
.meter[data-band="solid"] .meter__fill { background: var(--c-band-solid); }
.meter[data-band="review"] .meter__fill { background: var(--c-band-review); }
.meter[data-band="weak"] .meter__fill { background: var(--c-band-weak); }
.meter[data-band="accent"] .meter__fill { background: var(--c-accent); }
/* Score by question type: each level row is a <details>; the summary is the meter, the body lists its questions */
.level > summary { list-style: none; cursor: pointer; }
.level > summary::-webkit-details-marker { display: none; }
.level__caret { display: inline-block; margin-inline-end: var(--sp-2); color: var(--c-ink-3); font-size: var(--fs-xs); transition: transform var(--dur-fast) var(--ease); }
.level[open] .level__caret { transform: rotate(90deg); }
.level__items { padding: var(--sp-3) 0 var(--sp-1) var(--sp-5); }
@media (min-width: 48rem) {
  .meter {
    grid-template-columns: var(--w-meter-label) minmax(0, 1fr) var(--w-meter-value) var(--w-meter-band);
    grid-template-areas: "label bar value band";
  }
}

/* 9 ─ Question & options ───────────────────────────────────────────────── */
.question {
  display: flex; flex-direction: column; gap: var(--sp-4);
  padding: var(--sp-5); background: var(--c-surface);
  border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-1);
  scroll-margin-top: calc(var(--h-topbar) + var(--sp-10) + var(--sp-8));
}
.question__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); }
.question__number { font-size: var(--fs-sm); font-weight: var(--fw-bold); color: var(--c-accent-ink); }
.question__stem { font-size: var(--fs-md); line-height: var(--lh-snug); font-weight: var(--fw-medium); }
.question__tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); padding-top: var(--sp-3); border-top: var(--bw-1) solid var(--c-border); }
.question__nav { display: flex; align-items: center; gap: var(--sp-2); }
.question[data-current="true"] { border-color: var(--c-accent); }

.options { list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); }
.options--inline { flex-direction: row; flex-wrap: wrap; }
.options--inline .option { flex: 1 1 var(--w-flex-sm); }

.option {
  position: relative; display: flex; align-items: flex-start; gap: var(--sp-3);
  min-height: var(--h-touch); padding: var(--sp-3) var(--sp-4);
  border: var(--bw-1) solid var(--c-border-strong); border-radius: var(--radius-md);
  background: var(--c-surface); cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.option:hover { border-color: var(--c-accent); }
.option input { position: absolute; opacity: 0; pointer-events: none; }
.option:has(input:focus-visible) { box-shadow: var(--focus-ring); }
.option__key {
  flex: none; width: var(--size-key); height: var(--size-key); border-radius: var(--radius-pill);
  display: grid; place-items: center; border: var(--bw-1) solid var(--c-border-strong);
  font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--c-ink-2); background: var(--c-surface);
}
.option__text { flex: 1 1 auto; min-width: 0; padding-top: var(--sp-1); line-height: var(--lh-snug); }
.option__status { flex: none; display: inline-flex; align-items: center; gap: var(--sp-1); padding-top: var(--sp-1); font-size: var(--fs-xs); font-weight: var(--fw-semibold); }

.option[data-state="selected"], .option:has(input:checked) { border-color: var(--c-accent); background: var(--c-accent-soft); }
.option[data-state="selected"] .option__key, .option:has(input:checked) .option__key { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-ink-inverse); }
/* Revealed states (review / practice feedback) */
.option[data-state="correct"] { border-color: var(--c-correct-border); background: var(--c-correct-soft); }
.option[data-state="correct"] .option__key { background: var(--c-correct); border-color: var(--c-correct); color: var(--c-ink-inverse); }
.option[data-state="correct"] .option__status { color: var(--c-correct); }
.option[data-state="incorrect"] { border-color: var(--c-incorrect-border); background: var(--c-incorrect-soft); }
.option[data-state="incorrect"] .option__key { background: var(--c-incorrect); border-color: var(--c-incorrect); color: var(--c-ink-inverse); }
.option[data-state="incorrect"] .option__status { color: var(--c-incorrect); }
.option[data-state="dim"] { opacity: var(--opacity-muted); }
.option[aria-disabled="true"], .options[aria-disabled="true"] .option { cursor: default; }
.options[aria-disabled="true"] .option:hover { border-color: var(--c-border-strong); }
.options[aria-disabled="true"] .option[data-state="correct"]:hover { border-color: var(--c-correct-border); }
.options[aria-disabled="true"] .option[data-state="incorrect"]:hover { border-color: var(--c-incorrect-border); }

/* Practice-only "Not sure / Skip" */
/* Multi-select: square keys read as checkboxes (round keys = pick one) */
.options--multi .option__key { border-radius: var(--radius-xs); }
.option--skip { border-style: dashed; color: var(--c-ink-2); background: transparent; }
.option--skip .option__key { border-style: dashed; }

/* 10 ─ Feedback & citation ─────────────────────────────────────────────── */
.feedback {
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding: var(--sp-4); border-radius: var(--radius-md);
  background: var(--c-surface-2);
}
.feedback--correct { background: var(--c-correct-soft); }
.feedback--incorrect { background: var(--c-incorrect-soft); }
.feedback--skipped { background: var(--c-flag-soft); }
.feedback__verdict { display: flex; align-items: center; gap: var(--sp-2); font-weight: var(--fw-bold); }
.feedback--correct .feedback__verdict { color: var(--c-correct); }
.feedback--incorrect .feedback__verdict { color: var(--c-incorrect); }
.feedback--skipped .feedback__verdict { color: var(--c-flag); }
.feedback__body { color: var(--c-ink); font-size: var(--fs-sm); line-height: var(--lh-base); }

.citation {
  display: inline-flex; align-items: center; gap: var(--sp-1); max-width: 100%; vertical-align: baseline;
  padding: 0; border: 0; background: none;
  color: var(--c-accent-ink); font-size: var(--fs-xs); font-weight: var(--fw-semibold);
  text-decoration: none; cursor: pointer; text-align: start;
}
.citation:hover { color: var(--c-accent-strong); }
.citation:hover .citation__file { text-decoration: underline; }
.citation__file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.citation__loc { flex: none; color: var(--c-ink-3); font-weight: var(--fw-medium); }
.excerpt {
  margin: 0; padding-inline-start: var(--sp-3); border-inline-start: var(--bw-2) solid var(--c-border-strong);
  font-family: var(--font-read); font-size: var(--fs-sm); color: var(--c-ink-2); line-height: var(--lh-base);
}

/* 11 ─ Question navigator (sidebar / drawer) ───────────────────────────── */
.sidebar {
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding: var(--sp-4); background: var(--c-surface);
  border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-lg);
}
.sidebar__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.sidebar__close { display: inline-flex; }

/* Phone/tablet: the sidebar is an off-canvas drawer */
.sidebar--drawer {
  position: fixed; inset: 0 auto 0 0; z-index: var(--z-drawer);
  width: min(var(--w-sidebar), var(--w-drawer-max)); border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
  overflow-y: auto; transform: translateX(-105%); transition: transform var(--dur-base) var(--ease);
  box-shadow: var(--shadow-3);
}
.sidebar--drawer[data-open="true"] { transform: none; }
.drawer-scrim { position: fixed; inset: 0; background: var(--c-scrim); z-index: calc(var(--z-drawer) - 1); }
.drawer-toggle { display: inline-flex; }

@media (min-width: 64rem) {
  .sidebar--drawer {
    position: sticky; top: calc(var(--h-topbar) + var(--sp-10) + var(--sp-6)); inset: auto; z-index: auto;
    width: auto; transform: none; box-shadow: none; border-radius: var(--radius-lg);
    max-height: calc(100vh - var(--h-topbar) - var(--sp-10) - var(--sp-10));
  }
  .drawer-scrim, .drawer-toggle, .sidebar__close { display: none; }
}
@media (min-width: 64rem) {
  .focus { grid-template-columns: minmax(var(--w-sidepanel), 1fr) minmax(0, var(--w-read)) minmax(0, 1fr); }
  .focus__main { grid-column: 2; max-width: none; margin-inline: 0; }
  .focus__side { grid-column: 1; grid-row: 1; justify-self: end; width: var(--w-sidepanel); }
}

.qnav { display: flex; flex-direction: column; gap: var(--sp-2); }
.qnav__section { border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-md); background: var(--c-surface); }
.qnav__summary {
  display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3);
  cursor: pointer; list-style: none; font-size: var(--fs-sm); font-weight: var(--fw-semibold);
}
.qnav__summary::-webkit-details-marker { display: none; }
.qnav__summary::before { content: "▸"; color: var(--c-ink-3); font-size: var(--fs-xs); transition: transform var(--dur-fast) var(--ease); }
.qnav__section[open] > .qnav__summary::before { transform: rotate(90deg); }
.qnav__name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qnav__count { flex: none; font-size: var(--fs-xs); color: var(--c-ink-3); font-variant-numeric: tabular-nums; font-weight: var(--fw-medium); }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--size-chip), 1fr)); gap: var(--sp-1); padding: 0 var(--sp-3) var(--sp-3); }
.qnav__section > .chips:first-child { padding-top: var(--sp-3); }
.chip {
  position: relative; height: var(--size-chip); min-width: var(--size-chip);
  display: grid; place-items: center; border-radius: var(--radius-sm);
  border: var(--bw-1) solid var(--c-border-strong); background: var(--c-surface);
  font-size: var(--fs-2xs); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums;
  color: var(--c-ink-2); cursor: pointer; padding: 0;
}
.chip:hover { border-color: var(--c-accent); }
.chip[data-state="answered"] { background: var(--c-accent-soft); border-color: var(--c-info-border); color: var(--c-accent-ink); }
.chip[data-state="correct"] { background: var(--c-correct-soft); border-color: var(--c-correct-border); color: var(--c-correct); }
.chip[data-state="incorrect"] { background: var(--c-incorrect-soft); border-color: var(--c-incorrect-border); color: var(--c-incorrect); }
.chip[data-state="skipped"] { background: var(--c-flag-soft); border-color: var(--c-flag-border); color: var(--c-flag); }
.chip[data-flagged="true"]::after, .chip[data-focus="true"]::after {
  content: ""; position: absolute; top: calc(-1 * var(--sp-1)); right: calc(-1 * var(--sp-1));
  width: var(--sp-2); height: var(--sp-2); border-radius: var(--radius-pill);
  background: var(--c-flag); box-shadow: 0 0 0 var(--bw-2) var(--c-surface);
}
.chip[data-focus="true"]::after { background: var(--c-accent); }
.chip[aria-current="true"] { outline: var(--bw-2) solid var(--c-ink); outline-offset: var(--bw-1); }

.chip-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-1) var(--sp-3); font-size: var(--fs-xs); color: var(--c-ink-3); }
.chip-legend__item { display: inline-flex; align-items: center; gap: var(--sp-2); }
.chip-legend .chip { height: var(--sp-4); min-width: var(--sp-4); width: var(--sp-4); cursor: default; }

/* 12 ─ Segmented control & filters ──────────────────────────────────────── */
.segmented {
  display: inline-flex; flex-wrap: wrap; gap: var(--sp-px); padding: var(--sp-px);
  background: var(--c-surface-2); border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-md);
}
.segmented__option { position: relative; }
.segmented__option input { position: absolute; opacity: 0; pointer-events: none; }
.segmented__label {
  display: inline-flex; align-items: center; gap: var(--sp-1); min-height: var(--h-control-sm);
  padding: var(--sp-1) var(--sp-3); border-radius: var(--radius-sm);
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-ink-2); cursor: pointer;
}
.segmented__label:hover { color: var(--c-ink); }
.segmented__option input:checked + .segmented__label { background: var(--c-surface); color: var(--c-ink); box-shadow: var(--shadow-1); }
.segmented__option input:focus-visible + .segmented__label { box-shadow: var(--focus-ring); }
.segmented__caption { font-size: var(--fs-xs); color: var(--c-ink-3); }

/* Ghost text buttons divided by a | rule; the active one gets full ink contrast */
.filters { display: flex; flex-wrap: wrap; align-items: center; }
.filter {
  position: relative; display: inline-flex; align-items: center; gap: var(--sp-2); min-height: var(--h-control-sm);
  padding: var(--sp-1) var(--sp-3); border: 0; border-radius: var(--radius-sm); background: transparent;
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-ink-3); cursor: pointer;
}
.filter:hover { color: var(--c-ink); }
.filter[aria-pressed="true"] { color: var(--c-ink); background: var(--c-surface-2); }
.filters > .filter + .filter::before, .file-pages > li + li > .filter::before {
  content: ""; position: absolute; inset-inline-start: 0; top: var(--sp-2); bottom: var(--sp-2);
  width: var(--bw-1); background: var(--c-border-strong); pointer-events: none;
}
.filter__count { font-variant-numeric: tabular-nums; opacity: var(--opacity-muted); }

/* 13 ─ Reorder list (section order) ────────────────────────────────────── */
.reorder { list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); counter-reset: section; }
.reorder__item {
  counter-increment: section;
  display: grid; align-items: center; gap: var(--sp-2) var(--sp-3);
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "handle index name moves" "handle index meta moves";
  padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-2);
  background: var(--c-surface); border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-1);
}
.reorder__handle { grid-area: handle; color: var(--c-ink-3); cursor: grab; display: grid; place-items: center; width: var(--sp-6); height: var(--h-touch); }
.reorder__index::before { content: counter(section); }
.reorder__index {
  grid-area: index; width: var(--size-key); height: var(--size-key); border-radius: var(--radius-pill);
  display: grid; place-items: center; background: var(--c-surface-2);
  font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--c-ink-2);
}
.reorder__name { grid-area: name; font-weight: var(--fw-semibold); min-width: 0; }
.reorder__meta { grid-area: meta; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); font-size: var(--fs-xs); color: var(--c-ink-3); }
.reorder__moves { grid-area: moves; display: flex; flex-direction: column; gap: var(--sp-1); }
.reorder__item[data-dragging="true"] { opacity: var(--opacity-disabled); border-style: dashed; }
.reorder__item[data-drop="before"] { box-shadow: 0 calc(-1 * var(--bw-3)) 0 0 var(--c-accent); }
.reorder__item[data-drop="after"] { box-shadow: 0 var(--bw-3) 0 0 var(--c-accent); }
@media (min-width: 48rem) {
  .reorder__item { grid-template-columns: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "handle index name meta moves"; }
  .reorder__moves { flex-direction: row; }
}

/* 14 ─ Mastery panel & history list ────────────────────────────────────── */
.rows { list-style: none; display: flex; flex-direction: column; }
.row {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3);
  padding: var(--sp-3) var(--sp-5); border-top: var(--bw-1) solid var(--c-border);
}
.rows > .row:first-child { border-top: 0; }
.row__main { flex: 1 1 var(--w-flex-md); min-width: 0; display: flex; flex-direction: column; gap: var(--sp-px); }
.row__title { font-weight: var(--fw-semibold); font-size: var(--fs-sm); }
.row__meta { font-size: var(--fs-xs); color: var(--c-ink-3); }
.row__aside { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.row--link { cursor: pointer; }
.row--link:hover { background: var(--c-surface-2); }

/* 15 ─ Data table ──────────────────────────────────────────────────────── */
.table-wrap { position: relative; width: 100%; overflow-x: auto; border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-lg); background: var(--c-surface); }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.table caption { text-align: start; padding: var(--sp-3) var(--sp-4); font-weight: var(--fw-semibold); }
.table th, .table td { padding: var(--sp-2) var(--sp-4); text-align: start; border-bottom: var(--bw-1) solid var(--c-border); vertical-align: top; }
.table thead th { background: var(--c-surface-2); font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-ink-2); white-space: nowrap; }
.table tbody tr:last-child td, .table tbody tr:last-child th { border-bottom: 0; }
.table tbody tr:hover { background: var(--c-surface-2); }
.table .num { text-align: end; }
.table tfoot td { font-weight: var(--fw-semibold); background: var(--c-surface-2); }

/* 16 ─ Callouts & study plan ───────────────────────────────────────────── */
.callout {
  display: flex; gap: var(--sp-3); padding: var(--sp-4);
  border-radius: var(--radius-md); border: var(--bw-1) solid var(--c-info-border);
  background: var(--c-info-soft); color: var(--c-ink);
}
.callout__icon { flex: none; color: var(--c-info); padding-top: var(--sp-px); }
.callout__body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); font-size: var(--fs-sm); }
.callout__title { font-weight: var(--fw-semibold); font-size: var(--fs-sm); }
.callout__actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }
.callout--success { background: var(--c-correct-soft); border-color: var(--c-correct-border); }
.callout--success .callout__icon { color: var(--c-correct); }
.callout--warning { background: var(--c-flag-soft); border-color: var(--c-flag-border); }
.callout--warning .callout__icon { color: var(--c-flag); }
.callout--danger { background: var(--c-incorrect-soft); border-color: var(--c-incorrect-border); }
.callout--danger .callout__icon { color: var(--c-incorrect); }
.callout--neutral { background: var(--c-surface-2); border-color: var(--c-border); }
.callout--neutral .callout__icon { color: var(--c-ink-3); }

.plan { list-style: none; display: flex; flex-direction: column; gap: var(--sp-3); counter-reset: plan; }
.plan__item { counter-increment: plan; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
.plan__item::before {
  content: counter(plan); width: var(--size-key); height: var(--size-key); border-radius: var(--radius-pill);
  display: grid; place-items: center; background: var(--c-ink); color: var(--c-surface);
  font-size: var(--fs-xs); font-weight: var(--fw-bold);
}
.plan__body { display: flex; flex-direction: column; gap: var(--sp-1); font-size: var(--fs-sm); padding-top: var(--sp-1); }

.concept-list { list-style: none; display: flex; flex-direction: column; gap: var(--sp-2); }
.concept { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-2); font-size: var(--fs-sm); }
.concept__label { flex: 1 1 var(--w-flex-md); min-width: 0; }

/* 17 ─ Source browser ──────────────────────────────────────────────────── */
.file-list { list-style: none; display: flex; flex-direction: column; gap: var(--sp-1); }
.file {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-md); border: var(--bw-1) solid transparent;
  background: transparent; text-align: start; cursor: pointer; color: var(--c-ink);
}
.file:hover { background: var(--c-surface-2); }
.file[aria-current="true"] { background: var(--c-accent-soft); border-color: var(--c-info-border); }
.file__icon { flex: none; }
.file__icon[data-type="pdf"] { color: var(--c-file-pdf); }
.file__icon[data-type="pptx"] { color: var(--c-file-slides); }
.file__icon[data-type="docx"] { color: var(--c-file-doc); }
.file__icon[data-type="text"] { color: var(--c-file-text); }
.file__name { flex: 1 1 auto; min-width: 0; font-size: var(--fs-sm); font-weight: var(--fw-medium); overflow-wrap: anywhere; }
.file__count { flex: none; font-size: var(--fs-xs); color: var(--c-ink-3); font-variant-numeric: tabular-nums; }
.file-pages { list-style: none; display: flex; flex-wrap: wrap; padding: var(--sp-1) var(--sp-3) var(--sp-2) var(--sp-8); }
.file-pages .filter { min-height: var(--h-control-sm); }

.viewer { display: flex; flex-direction: column; gap: var(--sp-4); }
.viewer__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); }
/* File names keep their real case: Inter, not the all-caps display face */
.viewer__head h2 { font-family: var(--font-sans); font-size: var(--fs-lg); font-weight: var(--fw-semibold); letter-spacing: var(--tracking-tight); line-height: var(--lh-tight); }
.viewer__page {
  padding: var(--sp-6); background: var(--c-surface); border: var(--bw-1) solid var(--c-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-1);
  font-family: var(--font-read); font-size: var(--fs-base); line-height: var(--lh-read);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.viewer__page mark {
  background: var(--c-highlight); color: var(--c-highlight-ink);
  padding: var(--sp-px) var(--sp-1); border-radius: var(--radius-xs);
  box-shadow: 0 0 0 var(--bw-2) var(--c-highlight); scroll-margin: var(--sp-10);
}
.viewer__pager { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }

/* 18 ─ Dialog ──────────────────────────────────────────────────────────── */
.dialog {
  width: min(var(--w-dialog), calc(100vw - 2 * var(--gutter))); max-height: calc(100vh - 2 * var(--sp-7));
  padding: 0; border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-lg);
  background: var(--c-surface); color: var(--c-ink); box-shadow: var(--shadow-3);
}
.dialog::backdrop { background: var(--c-scrim); }
.dialog__inner { display: flex; flex-direction: column; max-height: inherit; }
.dialog__head { padding: var(--sp-5) var(--sp-5) var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-1); }
.dialog__body { padding: var(--sp-2) var(--sp-5) var(--sp-4); overflow-y: auto; display: flex; flex-direction: column; gap: var(--sp-4); font-size: var(--fs-sm); }
.dialog__foot { padding: var(--sp-4) var(--sp-5); border-top: var(--bw-1) solid var(--c-border); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--sp-2); }

/* 19 ─ Toast ───────────────────────────────────────────────────────────── */
.toast {
  position: fixed; left: 50%; bottom: var(--sp-6); transform: translate(-50%, var(--sp-10));
  z-index: var(--z-toast); max-width: calc(100vw - 2 * var(--gutter));
  padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-md);
  background: var(--c-ink); color: var(--c-surface); font-size: var(--fs-sm); box-shadow: var(--shadow-3);
  opacity: 0; pointer-events: none; transition: opacity var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
}
.toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }

/* 20 ─ Empty state ─────────────────────────────────────────────────────── */
.empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); text-align: center;
  padding: var(--sp-7) var(--sp-5); color: var(--c-ink-3); font-size: var(--fs-sm);
  border: var(--bw-1) dashed var(--c-border-strong); border-radius: var(--radius-lg);
}
.empty__title { color: var(--c-ink-2); font-weight: var(--fw-semibold); font-size: var(--fs-base); }

/* 21 ─ Forms ───────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: var(--sp-1); }
.field__label { font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-ink-2); }
.check { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); cursor: pointer; min-height: var(--h-control-sm); }
.check input { width: var(--size-icon); height: var(--size-icon); accent-color: var(--c-accent); margin: 0; }
.select, .input {

  border: var(--bw-1) solid var(--c-border-strong); border-radius: var(--radius-md);

}
.timer { display: inline-flex; align-items: center; gap: var(--sp-1); font-variant-numeric: tabular-nums; font-weight: var(--fw-semibold); font-size: var(--fs-sm); }

/* 22 ─ Icons & keyboard hints ──────────────────────────────────────────── */

.icon--lg { width: var(--size-icon-lg); height: var(--size-icon-lg); }

@media (min-width: 64rem) and (hover: hover) { .kbd-hints { display: flex; } }

.table-wrap:has(> .calc-table) { width: fit-content; max-width: 100%; }

.calc-input {

.calc-table td[data-state="incorrect"], .calc-table td[data-state="invalid"], .calc-table td[data-state="blank"],
.calc-box[data-state="incorrect"], .calc-box[data-state="invalid"], .calc-box[data-state="blank"] { background: var(--c-incorrect-soft); color: var(--c-incorrect); }
.calc-table td[data-state] .calc-val, .calc-box .calc-val { font-weight: var(--fw-semibold); }
.calc-mark { display: inline-flex; vertical-align: middle; margin-inline-start: var(--sp-1); }
.calc-exp, .calc-note { display: block; font-family: var(--font-sans); font-size: var(--fs-2xs); line-height: var(--lh-snug); color: var(--c-ink-2); white-space: nowrap; }
.calc-note { color: var(--c-flag); }
.calc-avgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.calc-avgs .calc-input { max-width: 10rem; }
.calc-box { padding: var(--sp-2) var(--sp-3); border: var(--bw-1) solid var(--c-border); border-radius: var(--radius-md); max-width: 14rem; }
.calc-solution { margin-top: var(--sp-2); }

.gantt--wide { min-width: 52rem; }
.gantt__seg {
  position: relative; flex: 0 0 calc(var(--pct) * 1%); min-height: var(--h-control);
  display: flex; align-items: center; justify-content: center;
  background: var(--c-accent-soft); color: var(--c-accent-ink);
  border: var(--bw-1) solid var(--c-info-border); border-inline-start-width: 0;
  font-size: var(--fs-xs); font-weight: var(--fw-semibold);
}
.gantt__seg:first-child { border-inline-start-width: var(--bw-1); border-start-start-radius: var(--radius-sm); border-end-start-radius: var(--radius-sm); }
.gantt__seg:last-of-type { border-start-end-radius: var(--radius-sm); border-end-end-radius: var(--radius-sm); }
.gantt__seg[data-idle="true"] { background: var(--c-surface-2); color: var(--c-ink-3); font-weight: var(--fw-regular); }
.gantt__t, .gantt__end { position: absolute; bottom: 0; font-size: var(--fs-2xs); color: var(--c-ink-3); transform: translateX(-50%); line-height: var(--lh-none); }
.gantt__t { inset-inline-start: 0; bottom: calc(-1 * var(--sp-4)); }
.gantt__end { inset-inline-end: 0; bottom: calc(var(--sp-5) - var(--sp-4)); transform: translateX(50%); }
.calc-scroll-hint { display: none; }
@media (max-width: 30rem) {

  .calc-table--sheet { min-width: 100%; }
  .calc-table--sheet td { min-width: 0; }

}

/* 23 ─ Print (results & answer review → Save as PDF) ───────────────────── */
@media print {
  :root { color-scheme: light; }

<script>
/* ==========================================================================
   Mock Exam Builder — runtime (templates/app.js)
   Shared by every exam file; build.py inlines it into templates/base.html.
   Do not fork this per exam. Exam-specific content lives in the manifest,
   item bank and source pages that build.py embeds.

   It renders ONLY classes from design-system/components.css. The one inline
   style it writes is the data variable `--pct` on .progress / .meter__fill.

   Views: home · order · exam · results · picker · practice · summary · sources
   Storage: localStorage "mockexam:<exam_id>" (try/catch; works without it).
   Mastery is written ONLY by submitExam(). Practice never touches it.
   ========================================================================== */
(function () {
  'use strict';

  /* ── 0. Helpers ─────────────────────────────────────────────────────── */
  var doc = document;
  function $(sel, root) { return (root || doc).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || doc).querySelectorAll(sel)); }
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
  function icon(name, cls) { return '<svg class="icon' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function fmtDate(iso, withTime) {
    try {
      var d = new Date(iso);
      var o = { year: 'numeric', month: 'short', day: 'numeric' };
      if (withTime) { o.hour = 'numeric'; o.minute = '2-digit'; }
      return d.toLocaleString(undefined, o);
    } catch (e) { return String(iso); }
  }
  function fmtDur(ms) {
    var s = Math.max(0, Math.round((ms || 0) / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    var two = function (n) { return (n < 10 ? '0' : '') + n; };
    return h ? h + ':' + two(m) + ':' + two(ss) : m + ':' + two(ss);
  }
  var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
  var LEVELS = ['recall', 'understand', 'apply', 'analyze'];
  var LEVEL_LABEL = { recall: 'Recall', understand: 'Understand', apply: 'Apply', analyze: 'Analyze' };
  var LEVEL_HINT = {
    recall: 're-read the definitions and key terms in the cited pages',
    understand: 'explain each concept in your own words from the cited pages',
    apply: 'rework the worked examples in the materials step by step',
    analyze: 'compare related concepts side by side using the materials'
  };
  // Two choices on purpose: fewer decisions, and every non-sure right answer counts as a lucky guess.
  var CONF = [['guess', 'Guessing'], ['sure', 'Sure']];
  function lowConf(r) { return !!r.conf && r.conf !== 'sure'; }  // also covers 'unsure' in attempts saved before it was removed
  function isBinary(it) { return it.type === 'tf' || it.type === 'yesno'; }  // yesno: legacy exams only
  // Multi-select (msq): the answer key and the student's answer are sorted index arrays; scoring is all-or-nothing.
  function isMulti(it) { return it.type === 'msq'; }
  function picked(ans, i) { return Array.isArray(ans) ? ans.indexOf(i) >= 0 : ans === i; }
  function sameAnswer(ans, key) {
    if (!Array.isArray(key)) return ans === key;
    return Array.isArray(ans) && ans.length === key.length && key.every(function (k) { return ans.indexOf(k) >= 0; });
  }
  function toggled(ans, i) { var a = Array.isArray(ans) ? ans.slice() : []; var j = a.indexOf(i); if (j >= 0) a.splice(j, 1); else a.push(i); return a.sort(function (x, y) { return x - y; }); }

  /* ── 1. Embedded data ───────────────────────────────────────────────── */
  var M = JSON.parse($('#exam-manifest').textContent);
  var bankEl = $('#exam-bank');
  var KEY = bankEl.getAttribute('data-k') || 'k';
  function decode(b64) {
    var bin = atob(String(b64).replace(/\s+/g, ''));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  var BANK = decode(bankEl.textContent).items;
  var ITEM = {}, ORDER_IN_BANK = {};
  BANK.forEach(function (it, i) { ITEM[it.id] = it; ORDER_IN_BANK[it.id] = i; });
  var SECRETS = {};
  /* Answers, explanations and sources are decoded only here, only on reveal. */
  function reveal(id) { if (!SECRETS[id]) SECRETS[id] = decode(ITEM[id].s); return SECRETS[id]; }
  var PAGES = null;
  function pages() {
    if (!PAGES) { var el = $('#source-pages'); PAGES = el && el.textContent.trim() ? decode(el.textContent) : {}; }
    return PAGES;
  }
  var TOPICS = M.topics || [];
  var TOPIC = {}; TOPICS.forEach(function (t) { TOPIC[t.id] = t; });
  var SOURCES = M.sources || [];
  var SOURCE = {}; SOURCES.forEach(function (s) { SOURCE[s.file] = s; });

  /* ── 2. Storage ─────────────────────────────────────────────────────── */
  var STORE_KEY = 'mockexam:' + M.exam_id;
  var THEME_KEY = 'mockexam:theme';
  function normalize(s) {
    s = s || {};
    return { v: 1, attempts: Array.isArray(s.attempts) ? s.attempts : [], inProgress: s.inProgress || null, practiceCounts: s.practiceCounts || {} };
  }
  function loadStore() { try { var raw = localStorage.getItem(STORE_KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { /* storage unavailable */ } return normalize(); }
  var store = loadStore();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* in-memory only */ } }

  /* ── 3. Mastery (mock exams only) ───────────────────────────────────── */
  var BANDS = {
    weak: { label: 'Weak', glyph: '✕', rank: 0 },
    review: { label: 'Needs review', glyph: '!', rank: 1 },
    none: { label: 'Not attempted', glyph: '–', rank: 2 },
    solid: { label: 'Solid', glyph: '✓', rank: 3 },
    mastered: { label: 'Mastered', glyph: '★', rank: 4 }
  };
  function bandOf(p) { return p == null ? 'none' : p >= 85 ? 'mastered' : p >= 70 ? 'solid' : p >= 50 ? 'review' : 'weak'; }
  function bandPill(b) { var d = BANDS[b] || BANDS.none; return '<span class="band" data-band="' + b + '"><span class="band__dot" aria-hidden="true">' + d.glyph + '</span>' + d.label + '</span>'; }
  function topicScore(a, tid) {
    var c = 0, n = 0;
    a.items.forEach(function (r) { if (r.topic === tid) { n++; if (r.result) c++; } });
    return n ? { correct: c, total: n, pct: pct(c, n) } : null;
  }
  function masteryMap() {
    var out = {};
    TOPICS.forEach(function (t) {
      var hits = store.attempts.map(function (a) { return topicScore(a, t.id); }).filter(Boolean);
      var last = hits[hits.length - 1], prev = hits[hits.length - 2];
      out[t.id] = { pct: last ? last.pct : null, band: bandOf(last ? last.pct : null), last: last || null, prevPct: prev ? prev.pct : null, exams: hits.length };
    });
    return out;
  }
  function conceptStatus() {
    var by = {};
    store.attempts.forEach(function (a, ai) {
      a.items.forEach(function (r) { by[r.concept] = by[r.concept] || {}; (by[r.concept][ai] = by[r.concept][ai] || []).push(r); });
    });
    var st = {};
    Object.keys(by).forEach(function (c) {
      var idx = Object.keys(by[c]).map(Number).sort(function (a, b) { return a - b; });
      var latest = by[c][idx[idx.length - 1]], prev = idx.length > 1 ? by[c][idx[idx.length - 2]] : null;
      var missed = latest.some(function (r) { return !r.result; });
      var low = latest.some(function (r) { return r.result && lowConf(r); });
      var prevMissed = prev && prev.some(function (r) { return !r.result; });
      st[c] = missed ? 'weak' : (low || prevMissed) ? 'shaky' : 'secure';
    });
    return st;
  }
  function recommendedOrder(mm) {
    return TOPICS.map(function (t, i) { return { t: t, i: i, m: mm[t.id] }; })
      .sort(function (a, b) {
        return (BANDS[a.m.band].rank - BANDS[b.m.band].rank) || ((a.m.pct == null ? 0 : a.m.pct) - (b.m.pct == null ? 0 : b.m.pct)) || (a.i - b.i);
      }).map(function (x) { return x.t.id; });
  }
  function courseOrder() { return TOPICS.map(function (t) { return t.id; }); }
  function attemptedIds() { var s = {}; store.attempts.forEach(function (a) { a.items.forEach(function (r) { s[r.id] = true; }); }); return s; }
  function isNewTopic(t, mm) { return M.version > 1 && t.added_in === M.version && mm[t.id].exams === 0; }
  function isNewItem(it, seen) { return M.version > 1 && it.added_in === M.version && !seen[it.id]; }
  function trendHTML(cur, prev) {
    if (cur == null || prev == null) return '';
    var d = cur - prev;
    if (d > 0) return '<span class="trend trend--up" title="Change since previous mock exam">▲ +' + d + '</span>';
    if (d < 0) return '<span class="trend trend--down" title="Change since previous mock exam">▼ ' + d + '</span>';
    return '<span class="trend trend--flat" title="No change since previous mock exam">– 0</span>';
  }

  /* ── 4. Citations ───────────────────────────────────────────────────── */
  function typeOf(file) { var s = SOURCE[file]; var t = s && s.type ? s.type : String(file).split('.').pop().toLowerCase(); return (t === 'pdf' || t === 'pptx' || t === 'docx') ? t : 'text'; }
  function locWord(type, many) {
    if (type === 'pdf') return many ? 'pp.' : 'p.';
    if (type === 'pptx') return many ? 'slides' : 'slide';
    return many ? 'sections' : 'section';
  }
  function ranges(nums) {
    var out = [], s = null, p = null;
    nums.forEach(function (n) { if (s === null) { s = p = n; } else if (n === p + 1) { p = n; } else { out.push(s === p ? '' + s : s + '–' + p); s = p = n; } });
    if (s !== null) out.push(s === p ? '' + s : s + '–' + p);
    return out.join(', ');
  }
  function citeButton(itemId, label, file) {
    var t = typeOf(file);
    return '<button type="button" class="citation" data-action="cite" data-item="' + esc(itemId) + '">' + icon('file-' + t, 'icon--sm') +
      '<span class="citation__file">' + esc(file) + '</span><span class="citation__loc">' + esc(label) + '</span></button>';
  }
  function itemCitation(id) { var s = reveal(id).source; return citeButton(id, s.loc || (locWord(typeOf(s.file)) + ' ' + s.page), s.file); }
  /* Group many items' sources into "Lecture3.pdf pp. 10–14" buttons. */
  function groupedCitations(ids) {
    var files = {}, orderF = [];
    ids.forEach(function (id) {
      if (!ITEM[id]) return;
      var s = reveal(id).source;
      if (!files[s.file]) { files[s.file] = {}; orderF.push(s.file); }
      if (!files[s.file][s.page]) files[s.file][s.page] = id;
    });
    return orderF.map(function (f) {
      var ps = Object.keys(files[f]).map(Number).sort(function (a, b) { return a - b; });

  }

  /* ── 5. UI state & rendering ────────────────────────────────────────── */
  var app = $('#app');
  var ui = { view: 'home', params: {}, back: null, practiceLen: '10', filter: 'all', order: null, shuffleWithin: false, prac: null, after: null };
  var VIEWS = {};
  function render() {
    registerStoreCalc();

  }

  }
  function pageHead(eyebrow, title, desc, actions) {

  function analyze(a) {

    var topics = a.order.filter(function (tid) { return TOPIC[tid] && topicScore(a, tid); }).map(function (tid) {

      var rs = a.items.filter(function (r) { return r.topic === tid; });
      var concepts = {}, corder = [];
      rs.forEach(function (r) { if (!concepts[r.concept]) { concepts[r.concept] = { id: r.concept, total: 0, missed: 0, ids: [] }; corder.push(r.concept); } concepts[r.concept].total++; if (!r.result) { concepts[r.concept].missed++; concepts[r.concept].ids.push(r.id); } });
      return { tid: tid, correct: s.correct, total: s.total, pct: s.pct, band: bandOf(s.pct), prevPct: ps ? ps.pct : null,
        missedConcepts: corder.map(function (c) { return concepts[c]; }).filter(function (c) { return c.missed; }),
        missedIds: rs.filter(function (r) { return !r.result; }).map(function (r) { return r.id; }) };
    });

    }).filter(Boolean);

      n: idx + 1, prev: prev, correct: correct, total: total, p: pct(correct, total), topics: topics, ranked: ranked, levels: levels,
      prevP: prev ? pct(prev.items.filter(function (r) { return r.result; }).length, prev.items.length) : null,
      misconceptions: a.items.filter(function (r) { return !r.result && r.answer != null && r.conf === 'sure' && ITEM[r.id]; }),

  /* ── 12. Import / export ────────────────────────────────────────────── */
  function exportProgress() {
    var data = { kind: 'mock-exam-progress', exam_id: M.exam_id, class_code: M.class_code, term: M.term, exported: new Date().toISOString(), attempts: store.attempts, practiceCounts: store.practiceCounts };
    try {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      var a = doc.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = M.class_code + '-' + M.term + '-progress.json'; doc.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('Progress exported.');
    } catch (e) { toast('Export isn’t available here.'); }
  }
  function importProgress(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (d.exam_id !== M.exam_id) { toast('That progress file belongs to a different exam.'); return; }
        var have = {}; store.attempts.forEach(function (a) { have[a.id] = 1; });
        var added = 0;
        (d.attempts || []).forEach(function (a) { if (!have[a.id]) { store.attempts.push(a); added++; } });
        store.attempts.sort(function (x, y) { return String(x.date).localeCompare(String(y.date)); });
        Object.keys(d.practiceCounts || {}).forEach(function (k) { store.practiceCounts[k] = Math.max(store.practiceCounts[k] || 0, d.practiceCounts[k]); });
        save(); render(); toast('Imported ' + plural(added, 'mock exam attempt') + '.');
      } catch (e) { toast('Couldn’t read that file.'); }
    };
    r.readAsText(file);
  }
